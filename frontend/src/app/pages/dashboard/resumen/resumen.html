<div class="dashboard-resumen container-fluid py-4">
  <h2 class="h3 fw-bold text-dark mb-4">Resumen General</h2>

  <div class="cards-container row g-3">
    <!-- Tarjeta 1: Preparados -->
    <div class="col-12 col-md-4">
      <div class="card border-0 shadow-sm border-start border-4 border-success h-100">
        <div class="card-body">
          <div class="card-title text-muted fw-semibold text-uppercase mb-2" style="font-size: 0.85rem;">
            Preparados
          </div>
          <div class="card-value display-6 fw-bold text-dark">
            {{ totalPreparados }}
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta 2: Pendientes -->
    <div class="col-12 col-md-4">
      <div class="card border-0 shadow-sm border-start border-4 border-warning h-100">
        <div class="card-body">
          <div class="card-title text-muted fw-semibold text-uppercase mb-2" style="font-size: 0.85rem;">
            Pendientes
          </div>
          <div class="card-value display-6 fw-bold text-dark">
            {{ totalPendientes }}
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta 3: Empleados Activos -->
    <div class="col-12 col-md-4">
      <div class="card border-0 shadow-sm border-start border-4 border-info h-100">
        <div class="card-body">
          <div class="card-title text-muted fw-semibold text-uppercase mb-2" style="font-size: 0.85rem;">
            Empleados Activos
          </div>
          <div class="card-value display-6 fw-bold text-dark">
            {{ totalEmpleadosActivos }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
