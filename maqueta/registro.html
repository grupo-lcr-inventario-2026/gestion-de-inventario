<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <title>Registro - Gestión de Inventario</title>
</head>
<body>
    <div class="page">
        <header class="header">
            <h1 class="header__title">Sistema de Gestión de Inventario</h1>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">Inicio</a></li>
                    <li><a href="login.html" class="nav__link">Login</a></li>
                    <li><a href="quienes-somos.html" class="nav__link">Quiénes Somos</a></li>
                </ul>
            </nav>
        </header>

        <main class="main">
            <section class="card">
                <h2 class="card__title">Registro de Usuario</h2>

                <form action="login.html" method="get">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" id="apellido" name="apellido" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="confirmar" class="form-label">Confirmar Contraseña</label>
                        <input type="password" id="confirmar" name="confirmar" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-primary">Registrarse</button>
                </form>

                <p class="card__text" style="margin-top: 1rem;">
                    ¿Ya tienes una cuenta?
                    <a href="login.html" class="nav__link">Iniciar sesión</a>
                </p>
            </section>
        </main>

        <footer class="footer">
            <p class="footer__text">Proyecto Gestión de Inventario - Full Stack I - 2026</p>
            <p class="footer__text">Grupo LCR</p>
        </footer>
    </div>
</body>
</html>
