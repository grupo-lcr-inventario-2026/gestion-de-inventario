<div class="container mt-4">
  <div class="row g-3">

    <!-- TABLA DE PRODUCTOS -->
    <div class="col-12 col-lg-8">
      <div class="card p-3 shadow-sm">
        <h2 class="h4 mb-3">Productos en Existencia</h2>

        <div class="table-responsive">
          <table class="table table-bordered align-middle">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let prod of productos">
                <td>{{ prod.id }}</td>
                <td>{{ prod.nombre }}</td>
                <td>
                  <span class="badge bg-primary fs-6">{{ prod.cantidad }}</span>
                </td>
                <td>
                  <button type="button" class="btn btn-sm btn-outline-primary" (click)="seleccionarProducto(prod)">
                    Editar
                  </button>
                </td>
              </tr>

              <tr *ngIf="productos.length === 0">
                <td colspan="4" class="text-center text-muted">No hay productos registrados.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- FORMULARIO DE INGRESO / ACTUALIZACIÓN -->
    <div class="col-12 col-lg-4">
      <div class="card p-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 mb-0">
            {{ productoSeleccionado ? 'Editar Stock' : 'Nuevo Producto' }}
          </h2>
          <button *ngIf="productoSeleccionado" type="button" class="btn btn-sm btn-link text-decoration-none" (click)="limpiarSeleccion()">
            + Nuevo
          </button>
        </div>

        <form [formGroup]="stockForm" (ngSubmit)="actualizarStock()">
          
          <div class="mb-3">
            <label class="form-label">Nombre del Producto</label>
            <input type="text" 
                   class="form-control" 
                   formControlName="productoNombre" 
                   placeholder="Ej: Lapicera Negra" 
                   [readonly]="productoSeleccionado !== null">
          </div>

          <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control" formControlName="cantidad" placeholder="Ej: 20">
          </div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="stockForm.invalid">
            {{ productoSeleccionado ? 'Guardar Cambios' : 'Ingresar Producto' }}
          </button>

        </form>
      </div>
    </div>

  </div>
</div>
