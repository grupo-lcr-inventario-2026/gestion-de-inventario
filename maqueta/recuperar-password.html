<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <title>Recuperar Contraseña - Gestión de Inventario</title>
</head>

<body>

<div class="page">

    <header>
        <nav class="navbar navbar-expand-lg custom-navbar px-3">

            <h1 class="header__title">
    Sistema de Gestión de Inventario
</h1>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNav"
                aria-controls="menuNav"
                aria-expanded="false"
                aria-label="Menú de navegación">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNav">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-2 text-center">

                    <li class="nav-item">
                        <a class="nav-link nav__link" href="index.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link nav__link" href="quienes-somos.html">Quiénes Somos</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-sm btn-outline-primary nav__link" href="login.html">
                            Iniciar Sesión
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-sm btn-outline-secondary nav__link" href="registro.html">
                            Registrarme
                        </a>
                    </li>

                </ul>

            </div>

        </nav>
    </header>

    <main class="main">

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-6 col-lg-4">

                    <section class="card shadow-sm p-4 p-md-5">

                        <h2 class="card__title text-center mb-4">
                            Recuperar Contraseña
                        </h2>

                        <p class="card__text text-center">
                            Ingresa tu correo electrónico para enviarte un enlace de recuperación.
                        </p>

                        <form>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Enviar enlace
                            </button>

                        </form>

                        <p class="mt-3 text-center">
                            <a href="login.html" class="text-decoration-none">
                                Volver al inicio de sesión
                            </a>
                        </p>

                    </section>

                </div>

            </div>

        </div>

    </main>

    <footer class="footer text-center">

        <p class="footer__text">
            Proyecto Gestión de Inventario - Full Stack I - 2026
        </p>

        <p class="footer__text">
            Grupo LCR
        </p>

    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
