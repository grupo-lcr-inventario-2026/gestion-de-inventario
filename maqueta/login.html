<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <title>Inicio de Sesión - Gestión de Inventario</title>
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-start gap-3">
                <h1 class="header__title">Sistema de Gestión de Inventario</h1>
                <ul class="list-unstyled d-flex flex-wrap justify-content-lg-end gap-2 mb-0">
                    <li><a href="registro.html" class="nav__link">Registrarme</a></li>
                </ul>
            </div>
            <nav class="mt-3" aria-label="Navegación principal">
                <ul class="list-unstyled d-flex flex-wrap justify-content-center gap-2 mb-0">
                    <li><a href="index.html" class="nav__link">Inicio</a></li>
                    <li><a href="quienes-somos.html" class="nav__link">Quiénes Somos</a></li>
                </ul>
            </nav>
        </header>

        <main class="main">
            <section>
                <h2>Iniciar Sesión</h2>

                <form action="dashboard-admin.html" method="get">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario o mail</label>
                        <input type="email" id="usuario" name="usuario" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" />
                    </div>

                    <button type="submit" class="btn btn-primary">Ingresar</button>
                </form>

                <p style="margin-top: 1rem;">
                    ¿No tienes cuenta?
                    <a href="registro.html">Registrarse</a>
                </p>

                <p>
    <a href="recuperar-password.html" class="text-decoration-none">
        ¿Olvidaste tu contraseña?
    </a>
</p>
            </section>
        </main>

        <footer class="footer">
            <p class="footer__text">Proyecto Gestión de Inventario - Full Stack I - 2026</p>
            <p class="footer__text">Grupo LCR</p>
        </footer>
    </div>
</body>
</html>
