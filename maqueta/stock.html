<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/custom.css">
    <title>Gestión de Stock - Gestión de Inventario</title>
</head>
<body>
    <div class="page">
        <header class="header">
            <h1 class="header__title">Sistema de Gestión de Inventario</h1>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">Inicio</a></li>
                    <li><a href="dashboard-admin.html" class="nav__link">Productos</a></li>
                    <li><a href="stock.html" class="nav__link">Stock</a></li>
                    <li><a href="reportes.html" class="nav__link">Reportes</a></li>
                    <li><a href="quienes-somos.html" class="nav__link">Quiénes Somos</a></li>
                    <li class="nav__item--login"><a href="login.html" class="nav__link">Login</a></li>
                </ul>
            </nav>
        </header>

        <main class="main">
    <div class="container">
        <div class="row">

            <div class="col-lg-8">
                <section class="card">
                    <h2 class="card__title">Productos en Existencia</h2>

                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Productos</th>
                                <th>Cantidad</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>001</td>
                                <td>Producto1</td>
                                <td>58</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary">
                                        Seleccionar
                                    </button>
                                </td>
                            </tr>

                            <tr>
                                <td>002</td>
                                <td>Producto2</td>
                                <td>56</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary">
                                        Seleccionar
                                    </button>
                                </td>
                            </tr>

                            <tr>
                                <td>003</td>
                                <td>Producto3</td>
                                <td>47</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary">
                                        Seleccionar
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>

            <div class="col-lg-4">
                <section class="card">
                    <h2 class="card__title">Actualizar Stock</h2>

                    <form id="stockForm">
                        <div class="mb-3">
                            <label for="productoNombre">Producto Seleccionado:</label>
                            <input type="text" id="productoNombre" class="form-control" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="cantidad">Modificar Cantidad Disponible:</label>
                            <input type="number" id="cantidad" class="form-control" placeholder="Ej: 21" required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Guardar Cambios
                        </button>
                    </form>

                    <div id="mensaje-feedback" class="mt-3 fw-bold"></div>
                </section>
            </div>

        </div>
    </div>
</main>
<footer class="footer">
            <p class="footer__text">Proyecto Gestión de Inventario - Full Stack I - 2026</p>
            <p class="footer__text">Grupo LCR</p>
        </footer>
    </div>
</body>
</html>
