<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/custom.css">

    <title>Recuperar Contraseña - Gestión de Inventario</title>
</head>

<body>

<div class="page">

    <!-- Encabezado simplificado -->
    <header class="header text-center">

        <h1 class="header__title">
            Sistema de Gestión de Inventario
        </h1>

    </header>

    <main class="main">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-5">

                    <section class="card">

                        <h2 class="card__title text-center">
                            Recuperar Contraseña
                        </h2>

                        <p class="card__text text-center">
                            Ingrese el correo electrónico asociado a su cuenta.
                        </p>

                        <form action="#" method="get">

                            <div class="mb-3">
                                <label for="correo" class="form-label">
                                    Correo Electrónico
                                </label>

                                <input
                                    type="email"
                                    id="correo"
                                    name="correo"
                                    class="form-control"
                                    placeholder="ejemplo@correo.com">
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Enviar Solicitud
                                </button>
                            </div>

                        </form>

                        <div class="text-center mt-3">
                            <a href="login.html" class="nav__link">
                                ← Volver al inicio de sesión
                            </a>
                        </div>

                    </section>

                </div>

            </div>

        </div>

    </main>

    <footer class="footer">

        <p class="footer__text">
            Proyecto Gestión de Inventario - Full Stack I - 2026
        </p>

        <p class="footer__text">
            Grupo LCR
        </p>

    </footer>

</div>

</body>
</html>
