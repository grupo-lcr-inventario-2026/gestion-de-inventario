<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">

    <title>Registro - Gestión de Inventario</title>
</head>

<body>

<div class="page">

    <header>
        <nav class="navbar navbar-expand-lg custom-navbar px-3">

            <h1 class="header__title">Sistema de Gestión de Inventario</h1>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNav"
                aria-controls="menuNav"
                aria-expanded="false"
                aria-label="Menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNav">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-2 text-center text-lg-end">

                    <li class="nav-item">
                        <a class="nav-link nav__link" href="index.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link nav__link" href="quienes-somos.html">Quiénes Somos</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-sm btn-outline-primary" href="login.html">
                            Iniciar Sesión
                        </a>
                    </li>

                </ul>

            </div>
        </nav>
    </header>

  
    <main class="main">

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-6 col-lg-4">

                    <section class="card shadow-sm p-4">

                        <h2 class="text-center mb-4">Registro de Usuario</h2>

                        <form action="login.html" method="get">

                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control form-control-sm">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Apellido</label>
                                <input type="text" class="form-control form-control-sm">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control form-control-sm">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control form-control-sm">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Confirmar contraseña</label>
                                <input type="password" class="form-control form-control-sm">
                            </div>

                            <button type="submit" class="btn btn-primary btn-sm w-100">
                                Registrarse
                            </button>

                        </form>

                        <p class="text-center mt-3 mb-0">
                            ¿Ya tienes una cuenta?
                            <a href="login.html" class="nav__link">Iniciar sesión</a>
                        </p>

                    </section>

                </div>

            </div>

        </div>

    </main>

  
    <footer class="footer text-center py-3">
        <p class="footer__text mb-0">
            Proyecto Gestión de Inventario - Full Stack I - 2026
        </p>
        <p class="footer__text mb-0">
            Grupo LCR
        </p>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
