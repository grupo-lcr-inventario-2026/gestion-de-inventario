<div class="container d-flex flex-column align-items-center justify-content-center min-vh-100 text-center py-5">

    <i class="bi bi-exclamation-triangle-fill display-1"></i>
  </div>

  <!-- Número de Error Grande -->

  <!-- Encabezado Secundario -->

  </p>

  <!-- Botones de Acción / Navegación -->
  <div class="d-flex flex-wrap justify-content-center gap-3">
    <a routerLink="/" class="btn btn-primary px-4 py-2">

    </a>
    <a routerLink="/dashboard" class="btn btn-outline-secondary px-4 py-2">

</div>
